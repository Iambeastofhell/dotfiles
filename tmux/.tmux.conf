# ~/.tmux.conf

# ============================================
# ESSENTIAL SETTINGS
# ============================================

set -sg escape-time 0
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g mouse on
set -g focus-events on

# Better terminal compatibility and true color support.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

setw -g aggressive-resize on
setw -g mode-keys vi

# ============================================
# KEY BINDINGS
# ============================================

unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Open new panes and windows in the current pane's directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================================
# STATUS BAR
# ============================================

set -g status-position bottom
set -g status-interval 5
set -g status-style 'bg=#13161d,fg=#8b949e'
set -g status-left-length 30
set -g status-right-length 100

# Show session, host, and whether prefix is active.
set -g status-left '#[fg=#00e68a,bold] #S #[fg=#30363d]|#[fg=#8b949e] #H #{?client_prefix,#[fg=#ffb86c]PREFIX,}'

# Show active pane path, zoom/copy markers, and time.
set -g status-right '#[fg=#8b949e]#{b:pane_current_path} #[fg=#30363d]|#[fg=#bd93f9]#(git -C "#{pane_current_path}" branch --show-current 2>/dev/null)#[fg=#30363d]|#[fg=#ffb86c]#{?window_zoomed_flag,ZOM,}#{?pane_in_mode, COPY,}#[fg=#30363d]|#[fg=#8b949e] %H:%M #[fg=#30363d]|#[fg=#8b949e] %d-%b-%y '

setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#13161d,bg=#00e68a,bold] #I:#W '
setw -g window-status-activity-style 'fg=#ffd866,bold'
setw -g window-status-bell-style 'fg=#ff5555,bold'

set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#00e68a'
set -g message-style 'bg=#00e68a,fg=#000000,bold'

# tmux 3.6+ per-pane scrollbars.
set -g pane-scrollbars on
set -g pane-scrollbars-position right

# ============================================
# COPY MODE
# ============================================

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
